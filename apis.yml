name: RiskPulse
description: >-
  RiskPulse was a supply chain risk and weather-intelligence company (also known
  by its Stormpulse brand) that scored and forecast weather, transit, and
  logistics disruption risk across supply chain networks. It was acquired by
  Everstream Analytics; the riskpulse.com and stormpulse.com domains now
  301-redirect to everstream.ai, where the capability lives on as Everstream's
  Weather Intelligence and Analytics product. As of this enrichment pass there is
  no standalone RiskPulse public API, developer portal, documentation, SDK, or
  discovery surface, and Everstream exposes no public API either. This profile is
  retained in the API Evangelist network as a historical company lead.
